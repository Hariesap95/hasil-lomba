<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GARETION VOL 5 - Nilai dan Prestasi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%86%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --wine:    #4a1220;
    --crimson: #b3202e;
    --paper:   #f5f3f4;
    --card:    #ffffff;
    --ink:     #2b2529;
    --muted:   #6e656b;
    --line:    #e6e1e4;
    --gold:    #e3b23c;
    --silver:  #c9ccd3;
    --bronze:  #c98a55;
    --display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --body:    "Public Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
  }

  /* ---------- Kepala halaman ---------- */
  .hero {
    background: var(--wine);
    color: #fff;
    padding: 36px 20px 64px;
  }
  .hero-inner { max-width: 600px; margin: 0 auto; display: flex; align-items: center; gap: 18px; }
  .medals { display: flex; flex: none; }
  .medals i {
    display: block; width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid var(--wine);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.28);
  }
  .medals i + i { margin-left: -6px; }
  .medals i:nth-child(1) { background: var(--silver); }
  .medals i:nth-child(2) { background: var(--gold); width: 40px; height: 40px; align-self: center; z-index: 1; }
  .medals i:nth-child(3) { background: var(--bronze); }
  .hero h1 {
    margin: 0;
    font-family: var(--display);
    font-stretch: 75%;
    font-weight: 800;
    font-size: clamp(2rem, 9vw, 2.9rem);
    line-height: 1;
    letter-spacing: -.005em;
  }
  .hero p { margin: 6px 0 0; color: rgba(255,255,255,.78); font-size: .95rem; }

  .wrap { max-width: 600px; margin: 0 auto; padding: 0 16px 48px; }

  /* ---------- Tiket kode ---------- */
  .ticket {
    position: relative;
    background: var(--card);
    border-radius: 14px;
    margin-top: -34px;
    box-shadow: 0 6px 24px rgba(74,18,32,.14);
  }
  .ticket-top { padding: 20px 20px 22px; }
  .ticket label { display: block; font-weight: 600; font-size: .95rem; margin-bottom: 8px; }
  .ticket input[type=text] {
    width: 100%;
    padding: 14px 12px;
    font-family: var(--display);
    font-stretch: 90%;
    font-weight: 700;
    font-size: 1.7rem;
    letter-spacing: .32em;
    text-indent: .32em;
    text-align: center;
    text-transform: uppercase;
    color: var(--wine);
    background: var(--paper);
    border: 2px solid transparent;
    border-radius: 8px;
  }
  .ticket input::placeholder { color: #b9b0b6; letter-spacing: .2em; }
  .ticket input:focus { outline: none; border-color: var(--crimson); background: #fff; }
  .perforation {
    position: relative;
    height: 0;
    border-top: 2px dashed var(--line);
    margin: 0 18px;
  }
  .perforation::before, .perforation::after {
    content: ""; position: absolute; top: -13px; width: 24px; height: 24px;
    border-radius: 50%; background: var(--paper);
  }
  .perforation::before { left: -30px; }
  .perforation::after  { right: -30px; }
  .ticket-bottom { padding: 18px 20px 20px; }
  .ticket-hint { margin: 10px 0 0; text-align: center; color: var(--muted); font-size: .85rem; }

  button#checkBtn {
    width: 100%;
    padding: 14px;
    font-family: var(--body);
    font-weight: 700;
    font-size: 1rem;
    color: #fff;
    background: var(--crimson);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s;
  }
  button#checkBtn:hover { background: #971a26; }
  button#checkBtn:disabled { opacity: .65; cursor: progress; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .msg { margin-top: 12px; padding: 12px 14px; border-radius: 8px; font-size: .92rem; }
  .msg.error { background: #fdecee; color: #8c1624; border-left: 4px solid var(--crimson); }
  .msg.info  { background: #eef3fb; color: #1e4373; border-left: 4px solid #4a78b8; }

  /* ---------- Hasil ---------- */
  #resultCard { margin-top: 20px; }
  .school-head {
    background: var(--card);
    border-radius: 14px 14px 0 0;
    padding: 22px 20px 18px;
    border-bottom: 1px solid var(--line);
  }
  .school-head h2 {
    margin: 0;
    font-family: var(--display);
    font-stretch: 80%;
    font-weight: 800;
    font-size: clamp(1.5rem, 6.5vw, 2rem);
    line-height: 1.1;
    color: var(--wine);
  }
  .school-meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
  .total-box { font-size: .95rem; }
  .total-box strong { font-family: var(--display); font-stretch: 90%; font-size: 1.35rem; color: var(--crimson); font-variant-numeric: tabular-nums; }
  .updated { color: var(--muted); font-size: .82rem; }

  .panel { background: var(--card); padding: 18px 20px; }
  .panel:last-child { border-radius: 0 0 14px 14px; }
  .panel + .panel { border-top: 1px solid var(--line); }

  /* Prestasi */
  .juara-box { background: #fff8e8; }
  .juara-box h3, .lomba-title {
    margin: 0 0 4px;
    font-family: var(--display);
    font-stretch: 85%;
    font-weight: 800;
    font-size: 1.25rem;
  }
  .juara-box h3 { color: #6b4a00; }
  .juara-group { margin-top: 16px; }
  .juara-group-title { font-weight: 700; font-size: .92rem; color: #6b4a00; padding-bottom: 6px; border-bottom: 2px solid #f0d89b; }
  .juara-item { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid #f5e6bd; }
  .juara-item:last-child { border-bottom: none; padding-bottom: 2px; }
  .medal {
    flex: none; width: 52px; height: 52px; border-radius: 50%;
    display: grid; place-items: center;
    font-family: var(--display); font-weight: 800; font-size: 1.35rem; font-stretch: 90%;
    color: #fff; background: var(--crimson);
    border: 3px solid #fff8e8;
    box-shadow: 0 0 0 2px var(--crimson), inset 0 0 0 3px rgba(255,255,255,.3);
    animation: pop .45s cubic-bezier(.2,1.4,.4,1) both;
    animation-delay: calc(var(--i, 0) * 70ms);
  }
  .medal.r1 { background: var(--gold);   color: #4a3300; box-shadow: 0 0 0 2px #b88a1c, inset 0 0 0 3px rgba(255,255,255,.4); }
  .medal.r2 { background: var(--silver); color: #35383f; box-shadow: 0 0 0 2px #9ea3ad, inset 0 0 0 3px rgba(255,255,255,.5); }
  .medal.r3 { background: var(--bronze); color: #3f230c; box-shadow: 0 0 0 2px #96602f, inset 0 0 0 3px rgba(255,255,255,.35); }
  @keyframes pop { from { transform: scale(.4) rotate(-14deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .juara-text { min-width: 0; }
  .juara-nama { font-weight: 700; font-size: 1.05rem; line-height: 1.25; }
  .juara-ket  { color: #5f5558; font-size: .9rem; margin-top: 2px; }

  /* Nilai per mata lomba */
  .lomba { margin-top: 18px; }
  .lomba:first-of-type { margin-top: 0; }
  .lomba-title { color: var(--wine); font-size: 1.1rem; }
  .table-scroll { overflow-x: auto; margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 9px 8px; border-bottom: 1px solid var(--line); font-size: .93rem; text-align: right; font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  th { color: var(--muted); font-weight: 600; font-size: .85rem; }
  td:last-child { font-weight: 700; color: var(--wine); padding-right: 0; }
  td.waktu { white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }

  @media (prefers-reduced-motion: reduce) {
    .medal { animation: none; }
    button#checkBtn { transition: none; }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="medals" aria-hidden="true"><i></i><i></i><i></i></div>
    <div>
      <h1>GARETION VOL 5</h1>
      <p>Cek nilai tim dan prestasi sekolah Anda.</p>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="ticket" aria-label="Masukkan kode sekolah">
    <div class="ticket-top">
      <label for="codeInput">Kode sekolah</label>
      <input type="text" id="codeInput" maxlength="8" placeholder="AB12CD" autocomplete="off" autocapitalize="characters" spellcheck="false">
    </div>
    <div class="perforation" aria-hidden="true"></div>
    <div class="ticket-bottom">
      <button id="checkBtn" onclick="cekNilai()">Lihat hasil</button>
      <p class="ticket-hint">Kode dibagikan oleh panitia untuk setiap sekolah.</p>
      <div id="messageBox" aria-live="polite"></div>
    </div>
  </section>

  <section id="resultCard" style="display:none;" aria-live="polite">
    <div class="school-head">
      <h2 id="schoolName"></h2>
      <div class="school-meta">
        <div class="updated">Diperbarui <span id="generatedAt"></span></div>
      </div>
    </div>
    <div id="juaraBox" class="panel juara-box" style="display:none;"></div>
    <div id="lombaList" class="panel"></div>
  </section>
</main>

<script>
  // File JSON ini diperbarui oleh aplikasi (lewat GitHub API).
  // Kalau halaman ini di-hosting di repo yang SAMA dengan file results.json,
  // path relatif "./results.json" sudah cukup.
  const RESULTS_URL = './results.json';

  async function cekNilai() {
    const input = document.getElementById('codeInput');
    const btn = document.getElementById('checkBtn');
    const messageBox = document.getElementById('messageBox');
    const resultCard = document.getElementById('resultCard');

    const code = input.value.trim().toUpperCase();
    messageBox.innerHTML = '';
    resultCard.style.display = 'none';

    if (!code) {
      messageBox.innerHTML = '<div class="msg error">Isi kode sekolah dulu, lalu klik Lihat hasil.</div>';
      input.focus();
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Memuat...';

    try {
      const res = await fetch(RESULTS_URL + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('Data belum bisa dimuat (kode ' + res.status + '). Coba lagi sebentar lagi.');
      const data = await res.json();

      const school = data.schools ? data.schools[code] : null;

      if (!school) {
        messageBox.innerHTML = '<div class="msg error">Kode tidak ditemukan. Periksa lagi kode dari panitia, huruf dan angkanya harus sama persis.</div>';
        return;
      }

      document.getElementById('schoolName').textContent = school.school_name;
      document.getElementById('generatedAt').textContent = data.generated_at || '-';

      renderJuara(data, school);

      const mataLomba = school.mata_lomba || [];
      const adaNilai = school.ada_nilai !== false && data.ada_nilai !== false;

      renderLomba(mataLomba, adaNilai);

      resultCard.style.display = 'block';
      resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (err) {
      messageBox.innerHTML = '<div class="msg error">' + escapeHtml(String(err.message || err)) + '</div>';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Lihat hasil';
    }
  }

  // Prestasi sekolah. Hanya tampil bila admin mengaktifkan Sinkron Juara
  // (data.ada_juara) dan sekolah ini punya juara yang sudah disinkron.
  function renderJuara(data, school) {
    const box = document.getElementById('juaraBox');
    box.innerHTML = '';
    box.style.display = 'none';

    const juara = (data.ada_juara && Array.isArray(school.juara)) ? school.juara : [];
    if (!juara.length) return;

    // Kelompokkan per jenis juara (urutan kemunculan dipertahankan)
    const groups = {};
    const order = [];
    juara.forEach(function (j) {
      const g = j.jenis_label || 'Juara';
      if (!groups[g]) { groups[g] = []; order.push(g); }
      groups[g].push(j);
    });

    let html = '<h3>Prestasi sekolah</h3>';
    let n = 0;
    order.forEach(function (g) {
      html += '<div class="juara-group"><div class="juara-group-title">' + escapeHtml(g) + '</div>';
      groups[g].forEach(function (j) {
        const r = Number(j.urut) || 0;
        const cls = (r >= 1 && r <= 3) ? ' r' + r : '';
        html += '<div class="juara-item">' +
          '<span class="medal' + cls + '" style="--i:' + (n++) + '">' + (r || '') + '</span>' +
          '<div class="juara-text">' +
            '<div class="juara-nama">' + escapeHtml(j.nama_juara) + '</div>' +
            '<div class="juara-ket">' + escapeHtml(j.keterangan || '') + '</div>' +
          '</div></div>';
      });
      html += '</div>';
    });

    box.innerHTML = html;
    box.style.display = 'block';
  }

  function renderLomba(mataLomba, adaNilai) {
    const list = document.getElementById('lombaList');
    list.innerHTML = '';

    if (!mataLomba.length) {
      list.style.display = 'none';
      return;
    }
    list.style.display = '';

    if (!adaNilai) {
      const info = document.createElement('div');
      info.className = 'msg info';
      info.style.marginTop = '0';
      info.textContent = 'Nilai belum diumumkan. Berikut daftar tim yang terdaftar.';
      list.appendChild(info);
    }

    mataLomba.forEach(function (ml) {
      const block = document.createElement('div');
      block.className = 'lomba';

      const title = document.createElement('div');
      title.className = 'lomba-title';
      title.textContent = ml.competition_name;
      block.appendChild(title);

      const wrap = document.createElement('div');
      wrap.className = 'table-scroll';
      const table = document.createElement('table');
      const teams = ml.teams || [];
      const duaJuri = adaJuri2(ml, teams);
      table.innerHTML = adaNilai
        ? '<thead><tr><th>Tim</th><th>Juri 1</th>' + (duaJuri ? '<th>Juri 2</th>' : '') + '<th>Waktu</th><th>Total</th></tr></thead>'
        : '<thead><tr><th>Tim</th></tr></thead>';
      const tbody = document.createElement('tbody');
      teams.forEach(function (t) {
        const tr = document.createElement('tr');
        tr.innerHTML = adaNilai
          ? '<td>' + escapeHtml(t.team_name) + '</td>' +
            '<td>' + escapeHtml(t.juri1_poin) + '</td>' +
            (duaJuri ? '<td>' + escapeHtml(t.juri2_poin) + '</td>' : '') +
            '<td class="waktu">' + escapeHtml(ambilWaktu(t)) + '</td>' +
            '<td>' + escapeHtml(t.total_poin) + '</td>'
          : '<td>' + escapeHtml(t.team_name) + '</td>';
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      block.appendChild(wrap);
      list.appendChild(block);
    });
  }

  // Apakah mata lomba ini memakai 2 juri?
  // 1) Pakai field jumlah_juri / juri bila ada di data.
  // 2) Kalau tidak ada: kolom Juri 2 hanya tampil bila ada tim yang punya nilai Juri 2 (bukan 0 / kosong).
  function adaJuri2(ml, teams) {
    const n = ml.jumlah_juri != null ? ml.jumlah_juri : (ml.juri != null ? ml.juri : null);
    if (n != null && n !== '') return Number(n) >= 2;
    return teams.some(function (t) {
      const v = t.juri2_poin;
      return v != null && v !== '' && Number(v) !== 0;
    });
  }

  // Waktu tim: coba beberapa nama field yang umum dipakai.
  function ambilWaktu(t) {
    const keys = ['waktu', 'waktu_juri1', 'waktu_juri_1', 'waktu_juri', 'durasi', 'duration', 'time'];
    for (let i = 0; i < keys.length; i++) {
      const v = t[keys[i]];
      if (v != null && String(v).trim() !== '') return String(v).trim();
    }
    return '-';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  document.getElementById('codeInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') cekNilai();
  });
</script>
</body>
</html>
